name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Repo Secrets'ta KEYSTORE_BASE64 tanımlıysa: secret'ı decode edip geçici bir
      # keystore dosyası oluşturur ve sonraki adımlara ortam değişkenleri olarak aktarır.
      # Secret tanımlı değilse bu adım hiçbir şey yapmaz, release imzasız derlenir.
      - name: Decode signing keystore (varsa)
        id: signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore_path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: su-hatirlatici-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Secret'lar tanımlıysa APK Gradle tarafından zaten imzalanmış olarak çıkar;
      # tanımlı değilse (henüz kurulum yapılmadıysa) imzasız çıkar. Artifact adı
      # her koşulda aynı kalır, dosyanın kendisi imzalı/imzasız olarak farklılaşır.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: su-hatirlatici-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
